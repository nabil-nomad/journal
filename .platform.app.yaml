name: "journal"
type: "python:3.12"
dependencies:
  python3:
    uv: "*"

variables:
  env:
    UV_PYTHON_DOWNLOADS: never

relationships:
  database: "db:postgresql"

# The configuration of the app when it's exposed to the web
web:
  upstream:
    socket_family: unix
  commands:
    start: "uv run --frozen --no-sync gunicorn -w 4 -b unix:$SOCKET journal.wsgi:application"
  locations:
    "/":
      passthru: true
    "/static":
      root: "static"
      expires: 1h
      allow: true

# The size of the persistent disk of the application (in MB)
disk: 512

# Set a local read/write mount for logs
mounts:
  "logs":
    source: local
    source_path: logs

# The hooks executed at various points in the lifecycle of the application
hooks:
  build: |
    set -eu
    uv sync --frozen --no-dev --group deployment

    mkdir logs
    uv run --frozen --no-sync python manage.py collectstatic
    rm -rf logs
  deploy: |
    uv run --frozen --no-sync python manage.py migrate
